services:
  mongo:
    profiles: ["legacy-migration"]
    image: mongo:8.0.30-noble@sha256:f40b97b97ce805c48ab428ce4422180ae0ef0de6dacadf1e32c6e6a1cbc9353d
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-ekavio}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ekavio-local-development-only}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekavio}
      POSTGRES_USER: ${POSTGRES_USER:-ekavio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekavio-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ekavio}:${POSTGRES_PASSWORD:-ekavio-local-development-only}@postgres:5432/${POSTGRES_DB:-ekavio}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-local-development-refresh-secret-change-before-production}
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      TRUST_PROXY_HOPS: 0
      EMAIL_TRANSPORT: disabled
      APP_PUBLIC_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:5000/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  legacy-tools:
    profiles: ["legacy-migration"]
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-ekavio}:${MONGO_ROOT_PASSWORD:-ekavio-local-development-only}@mongo:27017/ekavio?authSource=admin
      DATABASE_URL: postgresql://${POSTGRES_USER:-ekavio}:${POSTGRES_PASSWORD:-ekavio-local-development-only}@postgres:5432/${POSTGRES_DB:-ekavio}
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "--version"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
  postgres_data:
