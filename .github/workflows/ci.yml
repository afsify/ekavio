name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.30-noble@sha256:f40b97b97ce805c48ab428ce4422180ae0ef0de6dacadf1e32c6e6a1cbc9353d
        env:
          MONGO_INITDB_ROOT_USERNAME: ekavio
          MONGO_INITDB_ROOT_PASSWORD: ci-mongo-only
        ports:
          - 27017:27017
      postgres:
        image: postgres:17.11-alpine3.23@sha256:9ae4e8f8d0284836a505f0b2e825144e32e20499856e7dc5f7b99e19d10eedd6
        env:
          POSTGRES_DB: ekavio_test
          POSTGRES_USER: ekavio
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekavio -d ekavio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ekavio:ci-postgres-only@localhost:5432/ekavio_test
      POSTGRES_TEST_URL: postgresql://ekavio:ci-postgres-only@localhost:5432/postgres
      MONGO_TEST_URL: mongodb://ekavio:ci-mongo-only@localhost:27017/admin?authSource=admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test encrypted backup envelope and fail-closed recovery format
        run: node --test scripts/backup-envelope.test.mjs scripts/postgres-tooling.test.mjs

      - name: Test backup watchdog policy and workflow boundary
        run: node --test scripts/backup-watchdog.test.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Migrate PostgreSQL from zero
        working-directory: backend
        run: npm run db:migrate

      - name: Check PostgreSQL migration status
        working-directory: backend
        run: npm run db:migrate:status

      - name: Test PostgreSQL integration
        working-directory: backend
        run: npm run test:postgres

      - name: Test persistence parity contracts
        working-directory: backend
        run: npm run test:parity

      - name: Test cutover preflight
        working-directory: backend
        run: npm run test:preflight

      - name: Test PostgreSQL identity runtime cutover
        working-directory: backend
        run: npm run test:cutover

      - name: Test email identity, recovery, invitations and durable preferences
        working-directory: backend
        run: npm run test:identity-account

      - name: Test organization administration and tenant RBAC
        working-directory: backend
        run: npm run test:organization-admin

      - name: Test PostgreSQL commercial runtime cutover
        working-directory: backend
        run: npm run test:commercial

      - name: Test PostgreSQL operational foundation
        working-directory: backend
        run: npm run test:operational

      - name: Test operational migration and reconciliation
        working-directory: backend
        run: npm run test:operational-migration

      - name: Test operational runtime cutover
        working-directory: backend
        run: npm run test:operational-runtime

      - name: Test public commercial intake
        working-directory: backend
        run: npm run test:commercial-intake

      - name: Test manual commercial activation
        working-directory: backend
        run: npm run test:manual-commercial

      - name: Test public commercial experience and schema upgrade
        working-directory: backend
        run: npm run test:public-experience

      - name: Test manual commercial renewals
        working-directory: backend
        run: npm run test:commercial-renewal

      - name: Test PostgreSQL Attendance runtime
        working-directory: backend
        run: npm run test:attendance

      - name: Test Attendance migration and reconciliation
        working-directory: backend
        run: npm run test:attendance-migration

      - name: Test Attendance cutover controls
        working-directory: backend
        run: npm run test:attendance-cutover

      - name: Test PostgreSQL Customer Dues runtime
        working-directory: backend
        run: npm run test:customer-dues

      - name: Test Customer Dues migration and reconciliation
        working-directory: backend
        run: npm run test:customer-dues-migration

      - name: Test Customer Dues cutover controls
        working-directory: backend
        run: npm run test:customer-dues-cutover

      - name: Test PostgreSQL Inventory runtime
        working-directory: backend
        run: npm run test:inventory

      - name: Test Inventory migration and reconciliation
        working-directory: backend
        run: npm run test:inventory-migration

      - name: Test Inventory cutover controls
        working-directory: backend
        run: npm run test:inventory-cutover

      - name: Test PostgreSQL corporate runtime
        working-directory: backend
        run: npm run test:corporate

      - name: Test corporate migration and reconciliation
        working-directory: backend
        run: npm run test:corporate-migration

      - name: Test PostgreSQL security audit runtime
        working-directory: backend
        run: npm run test:audit

      - name: Test ActivityLog migration and reconciliation
        working-directory: backend
        run: npm run test:audit-migration

      - name: Test Mongo runtime retirement controls
        working-directory: backend
        run: npm run test:mongo-retirement

      - name: Test Mongo source boundary
        working-directory: backend
        run: npm run test:mongo-source-contract

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_SOCKET_URL: http://localhost:5000
        run: npm run build

      - name: Test frontend foundation
        working-directory: frontend
        run: npm test

      - name: Install QA Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test product experience in browser
        working-directory: frontend
        run: npm run test:e2e

      - name: Test PostgreSQL-backed identity and recovery in browser
        working-directory: frontend
        run: npm run test:e2e:identity

      - name: Test PostgreSQL-backed organization administration in browser
        working-directory: frontend
        run: npm run test:e2e:admin

      - name: Test PostgreSQL dynamic fields and layouts
        working-directory: backend
        run: npm run test:dynamic-fields

      - name: Test PostgreSQL-backed dynamic forms in browser
        working-directory: frontend
        run: npm run test:e2e:fields

      - name: Test PostgreSQL analytics reports notifications
        working-directory: backend
        run: npm run test:analytics-notifications

      - name: Test PostgreSQL-backed analytics notifications in browser
        working-directory: frontend
        run: npm run test:e2e:analytics

      - name: Test PostgreSQL-backed public commercial experience in browser
        working-directory: frontend
        run: npm run test:e2e:commercial

      - name: Test PostgreSQL CRM and atomic Customer conversion
        working-directory: backend
        run: npm run test:crm

      - name: Test PostgreSQL-backed CRM in browser
        working-directory: frontend
        run: npm run test:e2e:crm

      - name: Upload frontend QA evidence
        # Authenticated fixtures never enter uploaded traces/screenshots.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-product-experience
          path: |
            frontend/test-results
            !frontend/test-results/identity/**
            !frontend/test-results/organization-admin/**
            !frontend/test-results/dynamic-fields/**
            !frontend/test-results/analytics/**
            !frontend/test-results/commercial/**
            !frontend/test-results/crm/**
          retention-days: 7

      - name: Validate Docker Compose
        run: docker compose config
